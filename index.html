<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ensina Fácil</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:#ECEFF1;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.phone{
  width:370px;
  height:760px;
  background:white;
  border-radius:35px;
  overflow:hidden;
  box-shadow:0 15px 35px rgba(0,0,0,0.2);
  position:relative;
}
/* CONQUISTAS */

.achievement-card{

  display:flex;
  align-items:center;
  gap:15px;

  padding:18px;

  border-radius:22px;

  margin-bottom:18px;

  color:white;

  box-shadow:0 5px 15px rgba(0,0,0,0.08);

  transition:0.3s;
}

.achievement-card:hover{
  transform:translateY(-4px);
}

.achievement-icon{

  width:65px;
  height:65px;

  border-radius:18px;

  background:rgba(255,255,255,0.2);

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:30px;
}

.achievement-info{
  flex:1;
}

.achievement-info h2{
  font-size:20px;
  margin-bottom:5px;
}

.achievement-info p{
  font-size:14px;
  opacity:0.9;
}

.achievement-status{

  width:42px;
  height:42px;

  border-radius:50%;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:20px;

  background:rgba(255,255,255,0.2);
}

/* CORES */

.gold{
  background:linear-gradient(135deg,#F9A825,#FFD54F);
}

.silver{
  background:linear-gradient(135deg,#78909C,#B0BEC5);
}

.bronze{
  background:linear-gradient(135deg,#A1887F,#8D6E63);
}

.purple{
  background:linear-gradient(135deg,#7E57C2,#AB47BC);
}

.unlocked{
  background:#2EAF4A;
}

.locked{
  background:rgba(0,0,0,0.2);
}

.screen{
  display:none;
  flex-direction:column;
  height:100%;
}

.active{
  display:flex;
}

/* HEADER */

.header{
  position:relative;
  padding:25px;
  color:white;
  background:linear-gradient(135deg,#1565C0,#42A5F5);
  border-bottom-left-radius:35px;
  border-bottom-right-radius:35px;
  overflow:hidden;
}

.header::before{
  content:'';
  position:absolute;
  width:220px;
  height:220px;
  background:rgba(255,255,255,0.08);
  border-radius:50%;
  top:-100px;
  right:-80px;
}

.header::after{
  content:'';
  position:absolute;
  width:180px;
  height:180px;
  background:rgba(255,255,255,0.05);
  border-radius:50%;
  bottom:-90px;
  left:-70px;
}

/* TOPO */

.top-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
  z-index:2;
}

.user-info{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  background:rgba(255,255,255,0.2);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
}

.notify-btn{
  width:45px;
  height:45px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,0.2);
  color:white;
  font-size:20px;
  cursor:pointer;
  transition:0.3s;
}

.notify-btn:hover{
  transform:scale(1.1);
}

/* TEXTO HEADER */

.header-center{
  margin-top:22px;
  position:relative;
  z-index:2;
}

.header-center h1{
  font-size:32px;
}

.header-center p{
  margin-top:10px;
  font-size:15px;
  line-height:1.5;
}

/* PESQUISA */

.search-box{
  margin-top:20px;
  background:white;
  border-radius:18px;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  position:relative;
  z-index:2;
}

.search-box input{
  border:none;
  outline:none;
  width:100%;
  font-size:15px;
}

/* PROGRESSO */

.progress-area{
  margin-top:20px;
  position:relative;
  z-index:2;
}

.progress-text{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:14px;
}

.progress-bar{
  width:100%;
  height:12px;
  background:rgba(255,255,255,0.25);
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  width:72%;
  height:100%;
  background:white;
  border-radius:20px;
  animation:load 2s ease;
}

@keyframes load{
  from{
    width:0;
  }
  to{
    width:72%;
  }
}

/* CONTEÚDO */

.content{
  flex:1;
  overflow:auto;
  padding:20px;
}

/* CARDS */

.card{
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
  color:white;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.card:hover{
  transform:translateY(-5px);
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.card-icon{
  font-size:38px;
}

.green{
  background:linear-gradient(135deg,#2EAF4A,#66BB6A);
}

.blue{
  background:linear-gradient(135deg,#1565C0,#42A5F5);
}

.red{
  background:linear-gradient(135deg,#E53935,#EF5350);
}

.orange{
  background:linear-gradient(135deg,#FB8C00,#FFA726);
}

.card h2{
  margin-top:12px;
  font-size:24px;
}

.card p{
  margin-top:8px;
  font-size:15px;
  opacity:0.95;
}

/* AULAS */

.lesson{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.06);
}

.btn{
  border:none;
  padding:10px 18px;
  border-radius:12px;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
}

.btn-green{
  background:#2EAF4A;
}

/* QUIZ */

.quiz{
  margin-top:25px;
}

.quiz h2{
  text-align:center;
  margin-bottom:20px;
}

.options button{
  width:100%;
  margin-top:12px;
  padding:16px;
  border:none;
  border-radius:15px;
  background:#f1f1f1;
  cursor:pointer;
  font-size:18px;
  transition:0.3s;
}

.options button:hover{
  background:#1565C0;
  color:white;
}

/* RESULTADO */

.result{
  text-align:center;
  margin-top:100px;
}

.result h1{
  color:#2EAF4A;
  font-size:42px;
  margin-bottom:20px;
}

/* NAV */

.nav{
  height:85px;
  background:white;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:10px;
  box-shadow:0 -3px 10px rgba(0,0,0,0.08);
}

.nav-btn{
  border:none;
  background:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  color:#666;
  cursor:pointer;
  transition:0.3s;
  padding:10px 16px;
  border-radius:18px;
}

.nav-btn span{
  font-size:24px;
}

.nav-btn:hover{
  background:#E3F2FD;
  color:#1565C0;
  transform:translateY(-3px);
}

.active-nav{
  background:#1565C0;
  color:white;
  box-shadow:0 4px 12px rgba(21,101,192,0.3);
}

</style>
</head>
